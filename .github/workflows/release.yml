name: Release

# Tagging a version (git tag v1) builds the five packages and puts them on
# the Releases page.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # build.sh is the same script used to build by hand, called rather
      # than copied. It already checks formatting, runs vet and runs the
      # tests before compiling anything, so none of that is repeated here.
      # GITHUB_REF_NAME is the tag, and it is what "afterimage --version"
      # ends up printing.
      - name: Build the packages
        run: |
          sh build.sh
          ls -lh dist/*.zip dist/*.tar.gz

      # The release text comes from CHANGELOG.md, from the section whose
      # heading matches this tag exactly. No section, no notes: better than
      # the same generic paragraph on every version.
      - name: Prepare the release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v wanted="## $GITHUB_REF_NAME" '
              $0 == wanted { inside = 1; next }
              /^## / { inside = 0 }
              inside { print }
            ' CHANGELOG.md > notes.md
          fi
          touch notes.md
          cat >> notes.md <<'END'

          ## Download

          Take the package for your system, unpack it, and run the binary.
          There is nothing to install.

          | System | Package |
          |---|---|
          | Windows | `afterimage-windows.zip` |
          | Linux | `afterimage-linux.tar.gz` |
          | Linux on ARM | `afterimage-linux-arm.tar.gz` |
          | Mac with Apple silicon | `afterimage-mac-apple.tar.gz` |
          | Mac with Intel | `afterimage-mac-intel.tar.gz` |

          Run it on your own account. It reads the thumbnail caches, the
          recent file lists, the jump lists, the download history and the
          recycle bin, and then checks every record against the disk, so
          what comes out is the set of files your machine can still name or
          still show and that you no longer have.

          Deleting a file does not delete the picture of it, and nothing
          sweeps the caches when the file goes.

          It only reads. Nothing is written, moved, cleaned or deleted.
          END
          echo "--- notes ---"
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/afterimage-windows.zip
            dist/afterimage-linux.tar.gz
            dist/afterimage-linux-arm.tar.gz
            dist/afterimage-mac-apple.tar.gz
            dist/afterimage-mac-intel.tar.gz
          body_path: notes.md
